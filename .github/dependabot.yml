version: 2
updates:
  # Backend Python deps (pyproject.toml / uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  # Frontend deps (ui/package.json)
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next still bundles eslint-plugin-react ^7.37, whose
      # react/display-name rule uses APIs removed in ESLint 10. Hold on the
      # major until the Next.js lint stack supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
